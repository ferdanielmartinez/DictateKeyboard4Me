name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permissions
      run: |
        chmod +x gradlew
        chmod +x tools/bergamot/build-android.sh
        chmod +x tools/fetch-sherpa-onnx.sh

    - name: Fetch Sherpa-ONNX Libraries
      run: bash tools/fetch-sherpa-onnx.sh

    - name: Build Bergamot Library
      run: bash tools/bergamot/build-android.sh

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Dictate-APK
        path: app/build/outputs/apk/debug/*.apk
